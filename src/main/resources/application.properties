# =========== Server Configuration ===========
server.port=${PORT:8080}

# =========== Database Configuration ===========
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/velorix}
spring.data.mongodb.database=${MONGODB_DATABASE:velorix}

# =========== JWT Configuration ===========
jwt.secret=${JWT_SECRET:}
jwt.expiration.ms=86400000
jwt.access-token.expiration.ms=900000
jwt.refresh-token.expiration.ms=604800000

# =========== Email Configuration ===========
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========== Groq AI API ===========
groq.api.key=${GROQ_API_KEY:}

# =========== Resend API ===========
resend.api.key=${RESEND_API_KEY:}

# =========== Google OAuth2 ===========
google.client.id=${GOOGLE_CLIENT_ID:804602267087-d7s242t4t960shink1df3m0vi5h8tetd.apps.googleusercontent.com}

# =========== CORS Configuration ===========
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://vixiem.vercel.app,http://localhost:5173,http://localhost:5174,http://localhost:3000}

# Production requires HTTPS and a cryptographically random JWT_SECRET (64+ bytes).
app.cookie.secure=${APP_COOKIE_SECURE:true}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:None}

# =========== Frontend Configuration ===========
frontend.url=${FRONTEND_URL:https://vixiem.vercel.app}

# =========== Logging ===========
logging.level.root=INFO
logging.level.com.velorix.backend=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
